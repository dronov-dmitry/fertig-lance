<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Fertig-Lance</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: var(--bg);
        }
        .error-container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
            animation: fadeInUp 0.5s ease-out;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            color: var(--blue);
            margin-bottom: 1rem;
            letter-spacing: -0.05em;
            text-shadow: var(--shadow-md);
        }
        .error-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text);
        }
        .error-message {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--blue);
            color: #fff;
            text-decoration: none;
            border-radius: var(--r);
            font-weight: 600;
            transition: all var(--t);
            box-shadow: var(--shadow);
        }
        .home-btn:hover {
            background: var(--blue-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .home-btn::before {
            content: '←';
            font-size: 1.2rem;
        }
    </style>
    <!-- Automatic redirect for SPA support -->
    <script>
        // If someone hits a real path that doesn't exist, redirect to index.html with that path as hash
        (function() {
            var path = window.location.pathname;
            if (path !== '/' && path !== '/index.html' && !path.endsWith('.js') && !path.endsWith('.css') && !path.endsWith('.svg')) {
                var newUrl = '/index.html' + '#/' + path.replace(/^\//, '');
                // Optional: console.log('SPA Redirecting to:', newUrl);
                // window.location.replace(newUrl);
            }
        })();
    </script>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
            Oops! The page you're looking for doesn't exist or has been moved. 
            Don't worry, you can always find your way back.
        </p>
        <a href="index.html#/" class="home-btn">Back to Home</a>
    </div>
</body>
</html>
